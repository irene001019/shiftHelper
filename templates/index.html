<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Shift Helper</title>
  <link rel="stylesheet" href="/static/css/index.css">
</head>

<body>
  <div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none;">
      <button style="background: #2c3e50; cursor: default;">Calendar Converter</button>
    </a>
    <a href="/close-shift" style="text-decoration: none;">
      <button style="background: #95a5a6;">Close Shift Form</button>
    </a>
  </div>

  <h1>📅 PDF → ICS Converter</h1>
  <p>Upload your schedule PDF and convert it into a downloadable .ics calendar file.</p>

  <form id="uploadForm" enctype="multipart/form-data">
    <label>📂 Select Schedule PDF:</label><br>
    <input type="file" name="file" accept="application/pdf" required><br>

    <label>📅 Start Date:</label><br>
    <input type="date" name="start_date"><br>

    <label>📅 End Date:</label><br>
    <input type="date" name="end_date"><br>

    <label>Select Person</label><br>
    <select id="person_name" name="person_name">
      <option value="">-- Select Person --</option>
      <option value="Anchen">Anchen</option>
      <option value="Dani">Dani</option>
      <option value="Emily">Emily</option>
      <option value="Karmen">Karmen</option>
      <option value="Man-lin">Man-lin</option>
      <option value="Ruby">Ruby</option>
      <option value="Sommer">Sommer</option>
      <option value="Sophia">Sophia</option>
      <option value="Yen">Yen</option>
    </select><br>

    <div style="margin: 15px 0;">
      <input type="checkbox" id="sync_google" name="sync_google" style="width: auto;">
      <label for="sync_google" style="margin-right: 0;">Sync to Google Calendar</label>
    </div>

    <button type="submit">Upload & Convert</button>
  </form>

  <div id="result"></div>

  <script src="/static/js/index.js"></script>
</body>

</html>
