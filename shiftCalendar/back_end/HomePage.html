<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f7f8fa;
      color: #333;
    }

    h1 {
      color: #2c3e50;
    }

    form {
      background: white;
      display: inline-block;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
    }

    input,
    select {
      margin: 10px 0;
      padding: 8px 10px;
      width: 220px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    label {
      margin-right: 25px;
    }

    #result {
      margin-top: 25px;
    }
  </style>
</head>

  <body>
    <h1>📅 PDF → ICS Converter</h1>
    <p>Upload your schedule PDF and convert it into a downloadable .ics calendar file.</p>

    <form id="uploadForm" enctype="multipart/form-data">
      <label>📂 Select Schedule PDF:</label><br>
      <input type="file" name="file" accept="application/pdf" required><br>

      <label>📅 Start Date:</label><br>
      <input type="date" name="start_date"><br>

      <label>📅 End Date:</label><br>
      <input type="date" name="end_date"><br>

      <label>Select Person</label><br>
      <select id="person_name" name="person_name">
        <option value="">-- Select Person --</option>
        <option value="Anchen">Anchen</option>
        <option value="Dani">Dani</option>
        <option value="Emily">Emily</option>
        <option value="Karmen">Karmen</option>
        <option value="Man-lin">Man-lin</option>
        <option value="Ruby">Ruby</option>
        <option value="Sommer">Sommer</option>
        <option value="Sophia">Sophia</option>
        <option value="Yen">Yen</option>
      </select><br>

      <button type="submit">Upload & Convert</button>
    </form>

    <div id="result"></div>

    <script>
      const form = document.getElementById("uploadForm");
      const result = document.getElementById("result");
      const startDateInput = document.querySelector('input[name="start_date"]');
      const endDateInput = document.querySelector('input[name="end_date"]');

      // Set default Start Date to 1st of current month, End Date to last day of current month
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); // 0-indexed

      const firstDay = new Date(Date.UTC(year, month, 1));
      const lastDay = new Date(Date.UTC(year, month + 1, 0));

      startDateInput.value = firstDay.toISOString().split('T')[0];
      endDateInput.value = lastDay.toISOString().split('T')[0];

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        result.innerHTML = "⏳ Uploading and converting... please wait.";

        const formData = new FormData(form);

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData
          });

          if (!response.ok) {
            result.innerHTML = "❌ Upload failed.";
            return;
          }

          const html = await response.text();
          result.innerHTML = html; // server sends HTML snippet with download link
        } catch (err) {
          result.innerHTML = "⚠️ Error: " + err;
        }
      });
    </script>
  </body>

  </html>
